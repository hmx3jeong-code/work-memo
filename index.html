<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>업무 관리</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f8f7;color:#25272c;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;font-size:15px;line-height:1.6}header{background:#fff;border-bottom:1px solid #e9e9e7;padding:18px 32px}header div,main{max-width:1600px;margin:auto}header div{display:flex;align-items:baseline;gap:16px}h1{margin:0;font-size:20px;font-weight:750;letter-spacing:-.04em}header p{margin:0;color:#999b9f;font-size:13px}main{padding:34px 32px 64px}section,.card{background:#fff;border:1px solid #e9e9e7;border-radius:12px;padding:26px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px;align-items:start}.grid .card{margin:0;min-width:0}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}#app>.bar{padding:0 0 24px;gap:10px}#mode{font-size:14px;margin-right:4px}#status{margin-right:auto}input,textarea,button{font:inherit}input:not([type=checkbox]),textarea{border:1px solid #dedfdf;border-radius:8px;padding:11px 12px;width:100%;color:#25272c;background:#fff}textarea{min-height:260px;line-height:1.75;resize:vertical}button{background:#26282c;color:white;border:1px solid transparent;border-radius:7px;padding:9px 14px;line-height:1.4;font-size:13px;font-weight:600;cursor:pointer}button:hover{filter:brightness(.95)}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #6d86d5;outline-offset:2px}.secondary{background:#f5f5f3;color:#62656a;border-color:#ececea}.card h3{font-size:18px;letter-spacing:-.03em;margin:0 0 18px}.card>button{margin:0 6px 20px 0}.row{display:flex;gap:12px;padding:16px 0;border-top:1px solid #f0f0ee;align-items:flex-start}.row input[type=checkbox]{width:16px;height:16px;flex:0 0 16px;margin:4px 0 0;accent-color:#8ca1e8;cursor:pointer}.row span{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0;flex:1;line-height:1.65}.row button{flex:0 0 auto;padding:6px 10px;font-size:12px;color:#74777b;background:#f8f8f7}.done{color:#a1a3a7}.muted{color:#92959a;font-size:13px}.card>.muted{margin:0 0 16px;padding-left:28px;line-height:1.7}.hidden{display:none}pre{white-space:pre-wrap;overflow-wrap:anywhere}h2{margin:0 0 12px;font-size:18px}#login{max-width:440px;margin:70px auto}#login p{margin:8px 0 18px}#loginError{color:#b54d4d}#historyDetails summary{cursor:pointer;font-weight:600}#aiStatus:empty{display:none}#categories+section{margin-top:20px}@media(max-width:600px){header{padding:16px 20px}header div{display:block}header p{margin-top:2px}main{padding:24px 16px 48px}.grid{gap:14px}.card{padding:20px}.row{padding:14px 0}#status{flex-basis:100%;order:4}}
</style><style>
header div,main{max-width:1180px}main{padding-top:42px}#app>.bar{border-bottom:1px solid #eeefec;padding-bottom:18px;margin-bottom:32px}#status{font-size:12px}.workspace-heading{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px}.workspace-heading h2{font-size:28px;letter-spacing:-.045em;margin:3px 0 0}.eyebrow{font-size:10px;font-weight:750;color:#a1a39f;letter-spacing:.12em}.category-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:22px}.category-tab{min-height:80px;background:#fff;border:1px solid #e9eae7;border-radius:10px;color:#50534f;text-align:left;padding:16px 18px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:7px}.category-tab.active{border-color:#777b74;box-shadow:0 0 0 1px #777b74;color:#252823}.category-name{font-size:15px;font-weight:700;overflow-wrap:anywhere}.category-count{font-size:11px;color:#a1a49f;font-weight:500}.workspace-panel{padding:0 28px 18px;box-shadow:0 5px 24px rgba(40,45,40,.025)}.panel-heading{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:25px 0 21px}.panel-heading h3{margin:0;font-size:19px;letter-spacing:-.035em}.panel-heading p{margin:3px 0 0;color:#a0a39e;font-size:12px}.panel-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.small-quiet,.note-edit{background:transparent;color:#989b96;font-size:12px;font-weight:500;padding:7px 9px}.task-detail{border-top:1px solid #f0f1ee}.task-detail summary{display:flex;align-items:center;gap:13px;list-style:none;cursor:pointer;padding:17px 2px}.task-detail summary::-webkit-details-marker{display:none}.task-detail summary input{flex:0 0 16px;width:16px;height:16px;margin:0;accent-color:#8b9ddd}.task-title{flex:1;min-width:0;line-height:1.6;overflow-wrap:anywhere}.task-meta{font-size:12px;color:#b1b3af;white-space:nowrap}.task-arrow{font-size:22px;color:#b4b7b2;line-height:1;transition:transform .15s}.task-detail[open] .task-arrow{transform:rotate(90deg)}.task-body{margin:0 0 19px 29px;padding:19px 20px;background:#f8f9f7;border:1px solid #f0f1ee;border-radius:9px}.task-body-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.task-body-head strong{font-size:12px;color:#777b74}.notes-empty,.workspace-empty,.category-note{color:#a5a8a2;font-size:13px}.notes-empty{margin:9px 0 14px}.note-line{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;border-left:2px solid #dedfd9;padding:5px 0 5px 12px;margin:9px 0;color:#5d615a;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.note-line>span{flex:1}.note-edit{padding:0 4px}.add-note{background:transparent;color:#969b92;border:0;padding:7px 0;font-weight:500}.inline-input{min-height:90px;margin-top:10px;resize:vertical;font-size:14px}.inline-controls{display:flex;gap:6px;margin-top:5px}.small-primary{padding:7px 12px}.draft-area{margin-top:7px}.note-line:has(.inline-input){display:block}.raw-editor summary{cursor:pointer;font-size:14px;font-weight:650}.raw-editor p{margin-top:14px}.raw-editor textarea{min-height:240px}#aiStatus:empty{display:none}#historySection{margin-top:20px}.done{color:#a7aaa5}@media(max-width:600px){main{padding-top:25px}.workspace-heading h2{font-size:24px}.category-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.category-tab{min-height:72px;padding:13px}.workspace-panel{padding:0 18px 14px}.panel-heading{align-items:flex-start;flex-direction:column}.task-detail summary{gap:9px}.task-meta{font-size:11px}.task-body{margin-left:10px;padding:16px}}
.task-actions{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.delete-task{color:#b66a66}.delete-task:hover{color:#a54743;background:#fff3f2}
</style><script src="config.js" defer></script><script src="memo_model.js" defer></script><script src="workspace.js" defer></script><script src="app.js" defer></script></head><body><header><div><h1>업무 관리</h1><p>업무 메모와 진행 현황</p></div></header><main>
<section id="login"><h2>열람 키 입력</h2><p class="muted">전달받은 열람 키로 암호화된 메모를 엽니다.</p><form id="loginForm"><input id="pass" type="password" autocomplete="off" placeholder="열람 키" required><p><button>열기</button></p></form><p id="loginError" role="alert"></p></section>
<div id="app" class="hidden"><div class="bar"><strong id="mode">열람 모드</strong><span id="status" class="muted"></span><button id="sortDone" class="secondary" aria-pressed="true">✓ 완료 항목 위로</button><button id="refresh" class="secondary">새로고침</button><button id="editLogin" class="secondary">편집 권한 연결</button><button id="viewMode" class="secondary hidden">열람 모드로 전환</button><button id="logout" class="secondary">나가기</button></div>
<div id="categories"></div><p id="aiStatus" class="muted"></p>
<section id="editSection" class="hidden raw-editor"><details><summary>원본 메모 직접 수정</summary><p class="muted">메모장과 동기화되는 원본을 직접 수정할 수 있습니다.</p><textarea id="editor" aria-label="업무 메모"></textarea><p class="bar"><button id="save">저장</button><button id="addCategory" class="secondary">카테고리 추가</button></p></details></section>
<section id="historySection"><details id="historyDetails"><summary>변경 이력</summary><div id="history"></div></details></section></div></main></body></html>
